# Builds and publishes a release whenever the version in ModTender/modtender/__init__.py changes.
# Release files:
#   ModTender-Setup-<v>.exe  Windows installer (the real app; in-app updates use this)
#   ModTender-<v>.zip        script version (Python + run.bat / run.sh), kept so older installs can update
#   ModTender-<v>-linux-x64.tar.gz  Linux build (tested by starting it headless)
name: Release

on:
  push:
    branches: [main]
    paths: ["ModTender/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04  # older glibc, so the build runs on most current distros
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(sed -n 's/^__version__ *= *"\([^"]*\)".*/\1/p' ModTender/modtender/__init__.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-python@v5
        if: steps.version.outputs.exists == 'false'
        with:
          python-version: "3.12"

      - name: Build Linux app
        if: steps.version.outputs.exists == 'false'
        working-directory: ModTender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --clean --windowed --name ModTender \
            --add-data "modtender/assets:modtender/assets" main.py
          test -x dist/ModTender/ModTender

      - name: Self-test Linux app
        if: steps.version.outputs.exists == 'false'
        working-directory: ModTender
        run: |
          export MODTENDER_SELFTEST_OUT="$PWD/selftest.txt" MODTENDER_DATA="$PWD/selftest-data" QT_QPA_PLATFORM=offscreen
          timeout 90 dist/ModTender/ModTender --self-test || true
          if [ ! -f selftest.txt ]; then cat selftest-data/logs/modtender.log 2>/dev/null; echo "Self-test failed"; exit 1; fi
          cat selftest.txt

      - name: Package
        if: steps.version.outputs.exists == 'false'
        working-directory: ModTender
        run: |
          cp README-linux.txt dist/ModTender/README.txt
          tar -C dist -czf "../ModTender-${{ steps.version.outputs.version }}-linux-x64.tar.gz" ModTender

      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.exists == 'false'
        with:
          name: linux
          path: ModTender-*-linux-x64.tar.gz

  release:
    needs: linux
    if: ${{ !cancelled() }}  # a broken Linux build must not hold back the Windows release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(sed -n 's/^__version__ *= *"\([^"]*\)".*/\1/p' ModTender/modtender/__init__.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists, nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-python@v5
        if: steps.version.outputs.exists == 'false'
        with:
          python-version: "3.12"

      - name: Build ModTender.exe
        if: steps.version.outputs.exists == 'false'
        working-directory: ModTender
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --clean --windowed --name ModTender \
            --icon modtender/assets/modtender.ico \
            --add-data "modtender/assets;modtender/assets" \
            main.py
          test -f dist/ModTender/ModTender.exe

      - name: Self-test ModTender.exe
        if: steps.version.outputs.exists == 'false'
        working-directory: ModTender
        shell: pwsh
        run: |
          $env:MODTENDER_SELFTEST_OUT = "$PWD\selftest.txt"
          $env:MODTENDER_DATA = "$PWD\selftest-data"
          $p = Start-Process -FilePath "dist\ModTender\ModTender.exe" -ArgumentList "--self-test" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "ModTender.exe did not close within 90 seconds" }
          if (-not (Test-Path selftest.txt)) {
            Get-ChildItem selftest-data -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
            if (Test-Path selftest-data\logs\modtender.log) { Get-Content selftest-data\logs\modtender.log }
            throw "ModTender.exe started but did not finish its self-test"
          }
          Get-Content selftest.txt

      - name: Build installer
        if: steps.version.outputs.exists == 'false'
        working-directory: ModTender
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" installer\ModTender.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Microsoft Store package
        if: steps.version.outputs.exists == 'false'
        id: msix
        continue-on-error: true  # a Store packaging problem must never hold back the normal release
        working-directory: ModTender
        shell: pwsh
        run: |
          python -m pip install pillow
          python installer\make_msix.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The Store build has to start from its package layout and know it's the Store build.
          $env:MODTENDER_SELFTEST_OUT = "$PWD\selftest-store.txt"
          $env:MODTENDER_DATA = "$PWD\selftest-store-data"
          $p = Start-Process -FilePath "dist\msix-layout\ModTender\ModTender.exe" -ArgumentList "--self-test" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "The Store build did not close within 90 seconds" }
          if (-not (Test-Path selftest-store.txt)) { throw "The Store build did not finish its self-test" }
          $result = Get-Content selftest-store.txt
          $result
          if ($result -notmatch "store=True") { throw "The Store build doesn't know it's the Store build" }

      - name: Build script-version zip
        if: steps.version.outputs.exists == 'false'
        run: |
          python - <<'EOF'
          import os, zipfile
          v = "${{ steps.version.outputs.version }}"
          skip_dirs = {"dist", "build", ".venv", "__pycache__", ".modtender-update"}
          with zipfile.ZipFile(f"ModTender-{v}.zip", "w", zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk("ModTender"):
                  dirs[:] = [d for d in dirs if d not in skip_dirs]
                  for f in files:
                      if not f.endswith((".spec", ".pyc")):
                          path = os.path.join(root, f)
                          z.write(path, path.replace(os.sep, "/"))
          EOF

      - uses: actions/download-artifact@v4
        if: steps.version.outputs.exists == 'false'
        continue-on-error: true
        with:
          name: linux

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        run: |
          V="${{ steps.version.outputs.version }}"
          # Another run may have published this version while we were building.
          if gh release view "v$V" >/dev/null 2>&1; then echo "v$V is already published"; exit 0; fi
          awk -v v="## $V" '$0==v{f=1;next} /^## /{f=0} f' ModTender/CHANGELOG.md > notes.txt
          [ -s notes.txt ] || echo "ModTender $V" > notes.txt
          printf '\n---\n**New install:** download **ModTender-Setup-%s.exe** and run it.\n' "$V" >> notes.txt
          # The zip goes first: ModTender 0.5.x picks the first .zip it finds when updating itself.
          LINUX=""; [ -f "ModTender-$V-linux-x64.tar.gz" ] && LINUX="ModTender-$V-linux-x64.tar.gz"
          printf '**Linux:** download **ModTender-%s-linux-x64.tar.gz**, extract it and run ModTender inside.\n' "$V" >> notes.txt
          STORE=""; [ -f "ModTender/dist/ModTender-$V-store.msix" ] && STORE="ModTender/dist/ModTender-$V-store.msix"
          [ -n "$STORE" ] && printf '_ModTender-%s-store.msix is for the Microsoft Store submission, not for installing directly._\n' "$V" >> notes.txt
          gh release create "v$V" "ModTender-$V.zip" "ModTender/dist/ModTender-Setup-$V.exe" $LINUX $STORE \
            --title "ModTender $V" --notes-file notes.txt
        env:
          GH_TOKEN: ${{ github.token }}
